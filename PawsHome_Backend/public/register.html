<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PawsHome — Register</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
    }
    .center-card {
      max-width: 480px;
      margin: 60px auto;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="page-register">

  <!-- ✅ Navigation -->
  <nav>
    <div class="nav-inner container">
      <div class="brand">
        <div class="logo">🐾</div>
        <h1>PawsHome</h1>
      </div>
      <div class="nav-links">
        <a href="login.html" class="btn">Sign in</a>
      </div>
    </div>
  </nav>

  <!-- ✅ Registration Form -->
  <main class="container">
    <div class="center-card">
      <div class="card p-8">
        <h2>Create Account 🌟</h2>
        <form id="register-form" style="margin-top:20px">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input id="reg-name" class="input" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input id="reg-email" class="input" type="email" placeholder="you@email.com" required />
          </div>
          <div class="form-group">
            <label for="reg-phone">Phone</label>
            <input id="reg-phone" class="input" type="text" placeholder="Optional" />
          </div>
          <div class="form-group">
            <label for="reg-address">Address</label>
            <input id="reg-address" class="input" type="text" placeholder="Optional" />
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:12px">
            <button type="submit" class="btn btn-primary">✨ Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- ✅ Toast Notification -->
  <div id="site-toast" class="toast"></div>

  <!-- ✅ Inline Script -->
  <script>
    const API_BASE = "http://localhost:3000/api";

    function qs(sel, root = document) { return root.querySelector(sel); }
    function toast(msg, timeout = 2600) {
      const t = qs('#site-toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), timeout);
    }

    async function initRegisterPage() {
      const form = qs("#register-form");
      if (!form) return;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = qs("#reg-name").value.trim();
        const email = qs("#reg-email").value.trim();
        const phone = qs("#reg-phone").value.trim();
        const address = qs("#reg-address").value.trim();

        if (!name || !email) {
          toast("⚠️ Please fill in all required fields");
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/users/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, phone, address })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            toast(data.error || "❌ Registration failed");
            return;
          }

          toast("🎉 Registered successfully! Redirecting to login...");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);

        } catch (err) {
          console.error("Register error:", err);
          toast("❌ Unable to connect to server.");
        }
      });
    }

    document.addEventListener("DOMContentLoaded", initRegisterPage);
  </script>
</body>
</html>
