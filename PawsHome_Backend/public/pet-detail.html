<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PawsHome — Pet Detail</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Simple modal backdrop */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="page-pet-detail">

  <nav>
    <div class="nav-inner container">
      <div class="brand"><div class="logo">🐾</div><h1>PawsHome</h1></div>
      <div class="nav-links">
        <a href="pets.html" class="btn">Back to Pets</a>
        <a href="my-adoptions.html" class="btn">My Adoptions</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div style="margin-top:20px" id="pet-detail-root">
      <div class="detail-grid">
        <div class="detail-image">
          <img id="pet-image" src="" alt="pet image">
        </div>
        <div>
          <h1 id="pet-name" style="font-size:34px;margin:0">Name</h1>
          <div style="margin:10px 0"><span id="pet-category" class="badge"></span></div>
          <p id="pet-desc" style="font-size:16px;color:#334155"></p>

          <div class="mt-8 info-cards">
            <div class="info-card"><div class="kv">Age</div><div id="pet-age">--</div></div>
            <div class="info-card"><div class="kv">Breed</div><div id="pet-breed">--</div></div>
            <div class="info-card"><div class="kv">Gender</div><div id="pet-gender">--</div></div>
            <div class="info-card"><div class="kv">Weight</div><div id="pet-weight">--</div></div>
          </div>

          <div style="margin-top:16px">
            <div class="card" style="margin-top:12px;padding:16px">
              <strong>Health Status</strong>
              <p id="pet-health" class="small text-muted">--</p>
            </div>
          </div>

          <div style="margin-top:16px">
            <button id="adopt-open" class="adopt-btn btn-primary">✨ Adopt</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Adoption Modal -->
  <div id="adopt-modal" style="display:none">
    <div class="modal-backdrop">
      <div class="modal">
        <h3>Adoption Request</h3>
        <form id="adopt-form">
          <div class="form-group">
            <label for="adopter-contact">Contact Number</label>
            <input id="adopter-contact" class="input" type="text" placeholder="+91 98765 43210" required />
          </div>
          <div class="form-group">
            <label for="adopter-reason">Why do you want to adopt?</label>
            <textarea id="adopter-reason" class="input" rows="3" placeholder="Tell us why you’d love this pet..." required></textarea>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
            <button type="button" id="adopt-modal-close" class="btn">Cancel</button>
            <button type="submit" class="btn btn-primary">Submit Request</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="site-toast" class="toast"></div>

  <script>
    const API_BASE = "http://localhost:3000/api";

    function qs(sel, root=document){return root.querySelector(sel);}
    function toast(msg, timeout=2500){
      const t = qs('#site-toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), timeout);
    }
    function getUser(){
      try { return JSON.parse(localStorage.getItem('user')); } catch { return null; }
    }
    function getQueryParam(name){
      const u = new URL(window.location.href);
      return u.searchParams.get(name);
    }

    // Fetch and display pet details
    async function fetchPetById(id){
      const res = await fetch(`${API_BASE}/pets/${id}`);
      return res.json();
    }

    async function initPetDetailPage(){
      const id = getQueryParam('id');
      if(!id) return;
      const pet = await fetchPetById(id);

      qs('#pet-name').textContent = pet.Name;
      qs('#pet-category').textContent = pet.Category;
      qs('#pet-desc').textContent = pet.Description || 'No description available.';
      qs('#pet-image').src = pet.Image_URL || 'images/default.jpg';
      qs('#pet-age').textContent = pet.Age || '--';
      qs('#pet-breed').textContent = pet.Breed || '--';
      qs('#pet-gender').textContent = pet.Gender || '--';
      qs('#pet-weight').textContent = pet.Weight || '--';
      qs('#pet-health').textContent = pet.Health_Status || '--';

      const modal = qs('#adopt-modal');
      const openBtn = qs('#adopt-open');
      const closeBtn = qs('#adopt-modal-close');

      openBtn.addEventListener('click', ()=> modal.style.display='block');
      closeBtn.addEventListener('click', ()=> modal.style.display='none');

      const form = qs('#adopt-form');
      form.addEventListener('submit', async e=>{
        e.preventDefault();
        const user = getUser();
        if(!user){ toast("⚠️ Please login first!"); return; }

        const contact = qs('#adopter-contact').value.trim();
        const reason = qs('#adopter-reason').value.trim();

        if(!contact || !reason){
          toast("⚠️ Please fill in all fields");
          return;
        }

        try{
          const res = await fetch(`${API_BASE}/adoptions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              adopter_id: user.Adopter_ID,
              pet_id: pet.Pet_ID,
              contact_number: contact,
              reason
            })
          });
          const data = await res.json();

          if(!res.ok || !data.success){
            toast(data.error || "❌ Failed to submit adoption request");
            return;
          }

          toast("🎉 Adoption request submitted!");
          modal.style.display = "none";
          setTimeout(()=>{ window.location.href = "my-adoptions.html"; }, 1200);

        }catch(err){
          console.error("Adoption error:", err);
          toast("❌ Unable to connect to server.");
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initPetDetailPage);
  </script>
</body>
</html>
